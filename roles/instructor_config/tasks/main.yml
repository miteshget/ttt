---
- name: Login to OCP cluster
  ansible.builtin.command:
    argv:
      - oc
      - login
      - "{{ ocp_api_url }}"
      - "--username={{ ocp_admin_user }}"
      - "--password={{ ocp_admin_password }}"
      - --insecure-skip-tls-verify=false
  changed_when: false

- name: "{{ instructor.name }} — Create namespaces"
  ansible.builtin.include_tasks: namespaces.yml

- name: "{{ instructor.name }} — Deploy CTFd stack"
  ansible.builtin.include_tasks: ctfd_install.yml


- name: "{{ instructor.name }} — Configure Gitea users and repos"
  ansible.builtin.include_tasks: gitea.yml

- name: "{{ instructor.name }} — Create Keycloak SSO user"
  ansible.builtin.include_tasks: keycloak.yml

- name: "{{ instructor.name }} — Configure AAP org and access"
  ansible.builtin.include_tasks: aap.yml

- name: "{{ instructor.name }} — Configure CTFd"
  ansible.builtin.include_tasks: ctfd_config.yml